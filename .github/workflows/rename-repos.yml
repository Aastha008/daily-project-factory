name: Rename Past Projects to Human Names

on:
  workflow_dispatch:

jobs:
  rename-repos:
    name: Batch Rename Past Repositories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Factory Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Repository Renamer
        env:
          PAT_GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ secrets.GH_USERNAME || github.repository_owner }}
        run: |
          python rename_previous_repos.py

      - name: Commit and Push Updated History
        run: |
          git config --global user.name "${{ secrets.GH_USERNAME || github.repository_owner }}"
          git config --global user.email "${{ secrets.GH_EMAIL || format('{0}@users.noreply.github.com', secrets.GH_USERNAME || github.repository_owner) }}"
          git add data/projects.json
          if git diff --staged --quiet; then
            echo "No changes in projects.json to commit."
          else
            git commit -m "chore(history): update past project names and slugs [skip ci]"
            git push origin main || echo "History push skipped"
          fi

name: Daily Autonomous Project Factory

on:
  schedule:
    # Runs everyday at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Override Category'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 'Python'
          - 'AI'
          - 'Web Development'
          - 'Data Analytics'
          - 'Machine Learning'
          - 'Automation'
          - 'Full Stack'
      dry_run:
        description: 'Run in Dry Run mode (tests locally without publishing)'
        required: false
        default: false
        type: boolean
      mock_llm:
        description: 'Use Mock LLM Provider (offline demo)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish Daily Project
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Factory Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Project Factory
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAT_GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ secrets.GH_USERNAME || github.repository_owner }}
          MAX_DEBUG_ATTEMPTS: 5
        run: |
          python run.py ${{ inputs.category != '' && format('--category "{0}"', inputs.category) || '' }} ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.mock_llm && '--mock-llm' || '' }}

      - name: Commit and Push Project History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          if git diff --staged --quiet; then
            echo "No changes in project history to commit."
          else
            git commit -m "chore(history): update daily projects registry [skip ci]"
            git push origin main || echo "History push skipped"
          fi

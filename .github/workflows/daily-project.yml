name: Daily Autonomous Project Factory

on:
  schedule:
    # Runs everyday at 06:00 UTC (configurable)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Override Category (Python, AI, Web Development, Data Analytics, Machine Learning, Automation, Full Stack)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 'Python'
          - 'AI'
          - 'Web Development'
          - 'Data Analytics'
          - 'Machine Learning'
          - 'Automation'
          - 'Full Stack'
      dry_run:
        description: 'Run in Dry Run mode (tests everything without publishing to GitHub)'
        required: false
        default: false
        type: boolean
      mock_llm:
        description: 'Use Mock LLM Provider (no API key needed)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish Daily Project
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Factory Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Project Factory
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'gemini' }}
          MODEL_NAME: ${{ secrets.MODEL_NAME || 'gemini-2.5-flash' }}
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ secrets.GH_USERNAME || github.repository_owner }}
          MAX_DEBUG_ATTEMPTS: 5
        run: |
          ARGS=""
          if [ -n "${{ inputs.category }}" ]; then
            ARGS="$ARGS --category \"${{ inputs.category }}\""
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.mock_llm }}" = "true" ]; then
            ARGS="$ARGS --mock-llm"
          fi

          echo "Running Daily Project Factory with args: $ARGS"
          python run.py $ARGS

      - name: Commit and Push Project History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          if git diff --staged --quiet; then
            echo "No changes in project history to commit."
          else
            git commit -m "chore(history): update daily projects registry [skip ci]"
            git push origin main || git push
          fi
